<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn Tập Lịch Sử 10 - Hệ Thống Trắc Nghiệm Toàn Diện</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --correct: #10b981;
      --correct-bg: #ecfdf5;
      --correct-border: #059669;
      --wrong: #ef4444;
      --wrong-bg: #fef2f2;
      --wrong-border: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px 16px 120px 16px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
      text-align: center;
      border: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.4rem;
      color: var(--primary);
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 800;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Tabs */
    .tabs-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border: 2px solid var(--border);
      background: var(--card-bg);
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .tab-btn.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary);
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.1);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Cards */
    .question-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1.5px solid var(--border);
      transition: all 0.2s ease;
    }

    .passage-box {
      background: #f1f5f9;
      border-left: 4px solid var(--primary);
      padding: 14px 16px;
      margin-bottom: 16px;
      border-radius: 4px;
      font-style: italic;
      color: #334155;
    }

    .question-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: #0f172a;
    }

    .question-index {
      color: var(--primary);
      margin-right: 6px;
    }

    /* Styles cho phần trắc nghiệm 4 phương án */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.15s ease;
      background: #fff;
      text-align: left;
      color: var(--text);
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option-key {
      font-weight: 700;
      color: var(--primary);
      min-width: 24px;
    }

    .option-btn.selected-correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: #065f46 !important;
      font-weight: 600;
    }

    .option-btn.selected-wrong {
      background-color: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: #991b1b !important;
      font-weight: 600;
    }

    .option-btn.reveal-correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: #065f46 !important;
      font-weight: 700;
    }

    /* Styles cho phần Đúng/Sai dạng bảng danh sách */
    .tf-sub-item {
      padding: 14px;
      border-bottom: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tf-sub-item:last-child {
      border-bottom: none;
    }

    .tf-text {
      font-size: 0.96rem;
      font-weight: 500;
    }

    .tf-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .tf-choice-btn {
      padding: 6px 18px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      background: #fff;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tf-choice-btn.selected-true {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    .tf-choice-btn.selected-false {
      background: #475569;
      color: #fff;
      border-color: #475569;
    }

    .tf-result-badge {
      display: none;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      margin-left: auto;
    }

    .tf-result-badge.is-correct {
      display: inline-block;
      background: var(--correct-bg);
      color: var(--correct-border);
      border: 1px solid var(--correct-border);
    }

    .tf-result-badge.is-wrong {
      display: inline-block;
      background: var(--wrong-bg);
      color: var(--wrong-border);
      border: 1px solid var(--wrong-border);
    }

    .explanation {
      display: none;
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.92rem;
    }

    /* Footer Stats */
    .footer-actions {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 900px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .score-stats {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      padding: 9px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .submit-quiz-btn {
      background: var(--primary);
      color: #fff;
    }
    .submit-quiz-btn:hover {
      background: var(--primary-hover);
    }

    .reset-btn {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .reset-btn:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>HỆ THỐNG ÔN TẬP LỊCH SỬ 10 TOÀN DIỆN</h1>
      <p>Bao gồm trắc nghiệm 4 phương án và trắc nghiệm Đúng / Sai theo đoạn tư liệu</p>
    </header>

    <!-- Tabs chuyển bài -->
    <div class="tabs-container">
      <button class="tab-btn active" id="tab-btn-1" onclick="switchLesson(1)">
        Bài 1: Sự thành lập Liên Xô (20 câu)
      </button>
      <button class="tab-btn" id="tab-btn-2" onclick="switchLesson(2)">
        Bài 2: CNXH sau CTTG II (33 câu)
      </button>
      <button class="tab-btn" id="tab-btn-3" onclick="switchLesson(3)">
        Phần II: Câu hỏi Đúng - Sai (6 câu lớn)
      </button>
    </div>

    <!-- Bài 1 -->
    <div id="lesson-1" class="tab-content active">
      <div id="list-lesson-1"></div>
    </div>

    <!-- Bài 2 -->
    <div id="lesson-2" class="tab-content">
      <div id="list-lesson-2"></div>
    </div>

    <!-- Phần II: Đúng Sai -->
    <div id="lesson-3" class="tab-content">
      <div id="list-lesson-3"></div>
    </div>

    <!-- Sticky Footer Stats -->
    <div class="footer-actions">
      <div class="score-stats" id="stats-display">
        <span>Tiến độ: <strong id="stat-done">0</strong>/<span id="stat-total">20</span></span>
        <span style="color:#059669;">Đúng: <strong id="stat-correct">0</strong></span>
        <span style="color:#dc2626;">Sai: <strong id="stat-wrong">0</strong></span>
      </div>
      <div class="btn-group">
        <button type="button" class="action-btn submit-quiz-btn" id="submit-part2-btn" style="display:none;" onclick="submitPart2()">Nộp bài & Xem đáp án</button>
        <button type="button" class="action-btn reset-btn" onclick="resetCurrentLesson()">Làm lại</button>
      </div>
    </div>
  </div>

  <script>
    // Dữ liệu Bài 1: Trắc nghiệm Bài 3 (20 câu)
    const dataLesson1 = [
      {
        id: 1,
        question: "Năm 1922, Liên bang Cộng hoà xã hội chủ nghĩa Xô viết được thành lập trong bối cảnh nào sau đây?",
        options: {

        options: {

      },
      {
        id: 5,
        question: "Năm 1922, Đại hội Xô viết toàn Liên bang đã thông qua",
        options: {

          B: "sắc lệnh hoà bình rút nước Nga ra khỏi chiến tranh.",

          D: "Tuyên ngôn thành lập Liên bang cộng hòa xã hội chủ nghĩa Xô viết."
        },
        correct: "D",
        explain: "Tuyên ngôn thành lập Liên bang cộng hòa xã hội chủ nghĩa Xô viết được Đại hội thông qua."

      {
        id: 6,

        options: {

      },
      {

        },
        correct: "D",
        explain: "Liên Xô là tên gọi tắt của Liên bang Cộng hòa xã hội chủ nghĩa Xô viết."
      },
      {
        id: 8,
        question: "Năm 1924, Hiến pháp đầu tiên của Liên Xô đã",

        }

        card.innerHTML = `
          <div class="question-title">
            <span class="question-index">Câu ${index + 1}:</span> ${item.question}
          </div>
          <div class="options-grid">
            ${optionsHtml}
          </div>
          <div class="explanation" id="explain-l${lessonNum}-${item.id}"></div>
        `;
        container.appendChild(card);
      });
    }

    // Render Phần II: Đúng / Sai
    function renderPart2() {
      const container = document.getElementById("list-lesson-3");
      container.innerHTML = "";

      dataPart2.forEach((q) => {
        const card = document.createElement("div");
        card.className = "question-card";
        card.id = `card-part2-${q.id}`;

        let itemsHtml = "";
        q.items.forEach((sub) => {
          itemsHtml += `
            <div class="tf-sub-item" id="tf-row-${q.id}-${sub.key}">
              <div class="tf-text"><strong>${sub.key})</strong> ${sub.text}</div>
              <div class="tf-actions">
                <button type="button" class="tf-choice-btn" id="btn-tf-${q.id}-${sub.key}-true" onclick="selectTF(${q.id}, '${sub.key}', true)">ĐÚNG</button>
                <button type="button" class="tf-choice-btn" id="btn-tf-${q.id}-${sub.key}-false" onclick="selectTF(${q.id}, '${sub.key}', false)">SAI</button>
                <span class="tf-result-badge" id="badge-tf-${q.id}-${sub.key}"></span>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="question-title">${q.title}</div>
          <div class="passage-box">${q.passage.replace(/\n/g, '<br>')}</div>
          <div class="tf-list">${itemsHtml}</div>
        `;
        container.appendChild(card);
      });
    }

    renderQuiz(dataLesson1, "list-lesson-1", 1);
    renderQuiz(dataLesson2, "list-lesson-2", 2);
    renderPart2();

    // Xử lý trắc nghiệm 4 phương án
    function handleAnswer(lessonNum, qId, selectedKey) {
      const currentStats = stats[lessonNum];
      if (currentStats.answeredItems[qId]) return;

      const lessonData = lessonNum === 1 ? dataLesson1 : dataLesson2;
      const question = lessonData.find(q => q.id === qId);
      if (!question) return;

      currentStats.answeredItems[qId] = selectedKey;
      currentStats.done++;

      const selectedBtn = document.getElementById(`btn-l${lessonNum}-${qId}-${selectedKey}`);
      const correctBtn = document.getElementById(`btn-l${lessonNum}-${qId}-${question.correct}`);
      const card = document.getElementById(`card-l${lessonNum}-${qId}`);
      const explainBox = document.getElementById(`explain-l${lessonNum}-${qId}`);

      for (const key of Object.keys(question.options)) {
        const btn = document.getElementById(`btn-l${lessonNum}-${qId}-${key}`);
        if (btn) btn.disabled = true;
      }

      explainBox.style.display = "block";

      if (selectedKey === question.correct) {
        currentStats.correct++;
        selectedBtn.classList.add("selected-correct");
        card.style.borderColor = "var(--correct)";
        explainBox.style.background = "var(--correct-bg)";
        explainBox.style.color = "#065f46";
        explainBox.innerHTML = `<strong>CHÍNH XÁC!</strong> ${question.explain}`;
      } else {
        currentStats.wrong++;
        selectedBtn.classList.add("selected-wrong");
        if (correctBtn) correctBtn.classList.add("reveal-correct");
        card.style.borderColor = "var(--wrong)";
        explainBox.style.background = "var(--wrong-bg)";
        explainBox.style.color = "#991b1b";
        explainBox.innerHTML = `<strong>SAI RỒI!</strong> Đáp án đúng là: <strong>${question.correct}</strong>. <em>(${question.explain})</em>`;
      }

      updateStatsUI();
    }

    // Chọn Đúng / Sai ở Phần II
    function selectTF(qId, key, val) {
      const pairKey = `${qId}_${key}`;
      stats[3].userAnswers[pairKey] = val;

      const btnTrue = document.getElementById(`btn-tf-${qId}-${key}-true`);
      const btnFalse = document.getElementById(`btn-tf-${qId}-${key}-false`);

      if (val === true) {
        btnTrue.classList.add("selected-true");
        btnFalse.classList.remove("selected-false");
      } else {
        btnFalse.classList.add("selected-false");
        btnTrue.classList.remove("selected-true");
      }

      stats[3].done = Object.keys(stats[3].userAnswers).length;
      updateStatsUI();
    }

    // Nộp bài Phần II
    function submitPart2() {
      let correct = 0;
      let wrong = 0;

      dataPart2.forEach((q) => {
        q.items.forEach((sub) => {
          const pairKey = `${q.id}_${sub.key}`;
          const userVal = stats[3].userAnswers[pairKey];
          const badge = document.getElementById(`badge-tf-${q.id}-${sub.key}`);
          const btnTrue = document.getElementById(`btn-tf-${q.id}-${sub.key}-true`);
          const btnFalse = document.getElementById(`btn-tf-${q.id}-${sub.key}-false`);

          btnTrue.disabled = true;
          btnFalse.disabled = true;

          const correctText = sub.answer ? "ĐÚNG (Đ)" : "SAI (S)";

          if (userVal === undefined) {
            wrong++;
            badge.className = "tf-result-badge is-wrong";
            badge.innerHTML = `Chưa chọn! Đáp án trong giấy: <strong>${correctText}</strong>`;
          } else if (userVal === sub.answer) {
            correct++;
            badge.className = "tf-result-badge is-correct";
            badge.innerHTML = `✓ Chính xác! Đáp án trong giấy: <strong>${correctText}</strong>`;
          } else {
            wrong++;
            badge.className = "tf-result-badge is-wrong";
            badge.innerHTML = `✗ Sai! Đáp án trong giấy: <strong>${correctText}</strong>`;
          }
        });
      });

      stats[3].correct = correct;
      stats[3].wrong = wrong;
      updateStatsUI();

      alert(`Bạn đã hoàn thành Phần II!\nSố câu đúng: ${correct}/24\nSố câu sai: ${wrong}/24`);
    }

    // Cập nhật thống kê
    function updateStatsUI() {
      const current = stats[currentLesson];
      document.getElementById("stat-done").textContent = current.done;
      document.getElementById("stat-total").textContent = current.total;
      document.getElementById("stat-correct").textContent = current.correct;
      document.getElementById("stat-wrong").textContent = current.wrong;
    }

    // Chuyển Tab
    function switchLesson(lessonNum) {
      currentLesson = lessonNum;

      [1, 2, 3].forEach(num => {
        document.getElementById(`tab-btn-${num}`).classList.toggle("active", lessonNum === num);
        document.getElementById(`lesson-${num}`).classList.toggle("active", lessonNum === num);
      });

      const submitBtn = document.getElementById("submit-part2-btn");
      if (lessonNum === 3) {
        submitBtn.style.display = "inline-block";
      } else {
        submitBtn.style.display = "none";
      }

      updateStatsUI();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Làm lại bài
    function resetCurrentLesson() {
      if (!confirm(`Bạn có muốn làm lại nội dung mục này từ đầu không?`)) return;

      if (currentLesson === 1) {
        stats[1] = { done: 0, correct: 0, wrong: 0, total: 20, answeredItems: {} };
        renderQuiz(dataLesson1, "list-lesson-1", 1);
      } else if (currentLesson === 2) {
        stats[2] = { done: 0, correct: 0, wrong: 0, total: 33, answeredItems: {} };
        renderQuiz(dataLesson2, "list-lesson-2", 2);
      } else if (currentLesson === 3) {
        stats[3] = { done: 0, correct: 0, wrong: 0, total: 24, userAnswers: {} };
        renderPart2();
      }

      updateStatsUI();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    updateStatsUI();
  </script>
</body>
</html>
