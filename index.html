<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn Tập Trắc Nghiệm Lịch Sử 11</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --correct: #10b981;
      --correct-bg: #ecfdf5;
      --correct-border: #059669;
      --wrong: #ef4444;
      --wrong-bg: #fef2f2;
      --wrong-border: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px 120px 16px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
      text-align: center;
      border: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.45rem;
      color: var(--primary);
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 800;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Tabs */
    .tabs-container {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      border: 2px solid var(--border);
      background: var(--card-bg);
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .tab-btn.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary);
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.1);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Cards */
    .question-card {
      background: var(--card-bg);
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1.5px solid var(--border);
      transition: all 0.2s ease;
    }

    .question-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #0f172a;
    }

    .question-index {
      color: var(--primary);
      margin-right: 6px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.15s ease;
      background: #fff;
      text-align: left;
      color: var(--text);
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option-key {
      font-weight: 700;
      color: var(--primary);
      min-width: 24px;
    }

    .option-btn.selected-correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: #065f46 !important;
      font-weight: 600;
    }

    .option-btn.selected-wrong {
      background-color: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: #991b1b !important;
      font-weight: 600;
    }

    .option-btn.reveal-correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: #065f46 !important;
      font-weight: 700;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .explanation {
      display: none;
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.92rem;
    }

    /* Footer Stats */
    .footer-actions {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 860px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .score-stats {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .badge-correct {
      color: #059669;
    }

    .badge-wrong {
      color: #dc2626;
    }

    .reset-btn {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .reset-btn:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }
  </style>
</head>

        explain: "Nhanh chóng khôi phục sản xuất sau chiến tranh và cải thiện đời sống nhân dân."
      },
      {
        id: 28,
        question: "Nguyên nhân cơ bản dẫn tới sự khủng hoảng và sụp đổ của chủ nghĩa xã hội ở Liên Xô và các nước Đông Âu là do",
        options: {
          A: "tiến hành cải tổ muộn, gặp khó khăn khi tiến hành cải tổ.",
          B: "không tiến hành cách mạng khoa học – kĩ thuật hiện đại.",
          C: "đường lối lãnh đạo mang tính chủ quan, duy ý chí.",
          D: "sự chống phá của các thế lực thù địch ở trong nước."
        },
        correct: "C",
        explain: "Đường lối lãnh đạo mang nặng tính chủ quan, duy ý chí và mô hình kinh tế tập trung quan liêu kéo dài."
      },
      {
        id: 29,
        question: "Nguyên nhân khách quan dẫn đến sự khủng hoảng và sụp đổ của chế độ xã hội chủ nghĩa ở Liên Xô và Đông Âu là",
        options: {
          A: "sự chống phá của các thế lực thù địch.",
          B: "chưa bắt kịp sự phát triển khoa học – kĩ thuật.",
          C: "thiếu dân chủ và công bằng xã hội.",
          D: "phạm phải nhiều sai lầm khi cải tổ."
        },
        correct: "A",
        explain: "Sự can thiệp và chiến lược chống phá quyết liệt của các thế lực thù địch bên ngoài."
      },
      {
        id: 30,
        question: "Nội dung nào sau đây không phải là nguyên nhân dẫn đến khủng hoảng, sụp đổ của chế độ chủ nghĩa xã hội ở Liên Xô và các nước Đông Âu?",
        options: {
          A: "Không bắt kịp bước phát triển của khoa học - kĩ thuật tiên tiến trên thế giới.",
          B: "Đường lối lãnh đạo mang tính chủ quan, duy ý chí, kinh tế tập trung, quan liêu.",
          C: "Người dân không đồng tình, ủng hộ và tin tưởng vào chế độ chủ nghĩa xã hội.",
          D: "Sự chống phá của các thế lực thù địch ở trong nước và các thế lực bên ngoài."
        },
        correct: "C",
        explain: "Quần chúng nhân dân vẫn luôn hướng về lý tưởng XHCN, nguyên nhân sụp đổ là do sự sai lầm trong lãnh đạo và cải tổ."
      },
      {
        id: 31,
        question: "Từ thành công của công cuộc cải cách, mở cửa ở Trung Quốc (từ năm 1978) có thể rút ra bài học kinh nghiệm nào cho Việt Nam trong công cuộc đổi mới đất nước hiện nay?",
        options: {
          A: "Lấy đổi mới kinh tế làm trọng tâm, tập trung vốn cho ngành dịch vụ du lịch.",
          B: "Kiên định thực hiện nguyên tắc thống nhất, tập trung, dân chủ, lấy dân làm gốc.",
          C: "Lấy đổi mới chính trị làm trọng tâm và kiên định sự lãnh đạo của Đảng Cộng sản.",
          D: "Thực hiện mở cửa, hội nhập quốc tế, áp dụng hiệu quả khoa học - kĩ thuật."
        },
        correct: "D",
        explain: "Thực hiện mở cửa, hội nhập quốc tế và áp dụng mạnh mẽ các tiến bộ khoa học – kỹ thuật."
      },
      {
        id: 32,
        question: "Những thắng lợi của cách mạng Trung Quốc (1949), Việt Nam (1954), Cuba (1959) có ý nghĩa nào sau đây?",
        options: {
          A: "Mở rộng không gian địa lí của chủ nghĩa xã hội.",
          B: "Sự thắng thế của chủ nghĩa xã hội với chủ nghĩa tư bản.",
          C: "Chủ nghĩa xã hội trở thành đối trọng với chủ nghĩa tư bản.",
          D: "đánh dấu chủ nghĩa xã hội vượt ra khỏi phạm vi một nước và trở thành hệ thống thế giới."
        },
        correct: "A",
        explain: "Mở rộng không gian địa lý của hệ thống xã hội chủ nghĩa sang các châu lục khác."
      },
      {
        id: 33,
        question: "Thành tựu của Liên Xô và Đông Âu trong công cuộc xây dựng cơ sở vật chất của chủ nghĩa xã hội có tác động như thế nào đến tham vọng của Mĩ sau Chiến tranh thế giới thứ hai?",
        options: {
          A: "Tạo ra sự đối trọng với hệ thống tư bản chủ nghĩa.",
          B: "Làm đảo lộn chiến lược toàn cầu của Mĩ.",
          C: "Tạo ra sự cân bằng về sức mạnh quân sự."
        },
        correct: "B",
        explain: "Làm đảo lộn chiến lược toàn cầu mưu toan làm bá chủ thế giới của Mỹ."
      }
    ];

    let currentLesson = 1;
    const stats = {
      1: { done: 0, correct: 0, wrong: 0, total: 20, answeredItems: {} },
      2: { done: 0, correct: 0, wrong: 0, total: 33, answeredItems: {} }
    };

    function renderQuiz(list, containerId, lessonNum) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      list.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "question-card";
        card.id = `card-l${lessonNum}-${item.id}`;

        let optionsHtml = "";
        for (const [key, value] of Object.entries(item.options)) {
          optionsHtml += `
            <button type="button" 
                    class="option-btn" 
                    id="btn-l${lessonNum}-${item.id}-${key}"
                    onclick="handleAnswer(${lessonNum}, ${item.id}, '${key}')">
              <span class="option-key">${key}.</span>
              <span>${value}</span>
            </button>
          `;
        }

        card.innerHTML = `
          <div class="question-title">
            <span class="question-index">Câu ${index + 1}:</span> ${item.question}
          </div>
          <div class="options-grid">
            ${optionsHtml}
          </div>
          <div class="explanation" id="explain-l${lessonNum}-${item.id}"></div>
        `;
        container.appendChild(card);
      });
    }

    renderQuiz(dataLesson1, "list-lesson-1", 1);
    renderQuiz(dataLesson2, "list-lesson-2", 2);

    function handleAnswer(lessonNum, qId, selectedKey) {
      const currentStats = stats[lessonNum];
      if (currentStats.answeredItems[qId]) return;

      const lessonData = lessonNum === 1 ? dataLesson1 : dataLesson2;
      const question = lessonData.find(q => q.id === qId);
      if (!question) return;

      currentStats.answeredItems[qId] = selectedKey;
      currentStats.done++;

      const selectedBtn = document.getElementById(`btn-l${lessonNum}-${qId}-${selectedKey}`);
      const correctBtn = document.getElementById(`btn-l${lessonNum}-${qId}-${question.correct}`);
      const card = document.getElementById(`card-l${lessonNum}-${qId}`);
      const explainBox = document.getElementById(`explain-l${lessonNum}-${qId}`);

      for (const key of Object.keys(question.options)) {
        const btn = document.getElementById(`btn-l${lessonNum}-${qId}-${key}`);
        if (btn) btn.disabled = true;
      }

      explainBox.style.display = "block";

      if (selectedKey === question.correct) {
        currentStats.correct++;
        selectedBtn.classList.add("selected-correct");
        card.style.borderColor = "var(--correct)";
        explainBox.style.background = "var(--correct-bg)";
        explainBox.style.color = "#065f46";
        explainBox.innerHTML = `<strong>CHÍNH XÁC!</strong> ${question.explain}`;
      } else {
        currentStats.wrong++;
        selectedBtn.classList.add("selected-wrong");
        if (correctBtn) correctBtn.classList.add("reveal-correct");
        card.style.borderColor = "var(--wrong)";
        explainBox.style.background = "var(--wrong-bg)";
        explainBox.style.color = "#991b1b";
        explainBox.innerHTML = `<strong>SAI RỒI!</strong> Đáp án đúng là: <strong>${question.correct}</strong>. <em>(${question.explain})</em>`;
      }

      updateStatsUI();
    }

    function updateStatsUI() {
      const current = stats[currentLesson];
      document.getElementById("stat-done").textContent = current.done;
      document.getElementById("stat-total").textContent = current.total;
      document.getElementById("stat-correct").textContent = current.correct;
      document.getElementById("stat-wrong").textContent = current.wrong;
    }

    function switchLesson(lessonNum) {
      currentLesson = lessonNum;

      document.getElementById("tab-btn-1").classList.toggle("active", lessonNum === 1);
      document.getElementById("tab-btn-2").classList.toggle("active", lessonNum === 2);

      document.getElementById("lesson-1").classList.toggle("active", lessonNum === 1);
      document.getElementById("lesson-2").classList.toggle("active", lessonNum === 2);

      updateStatsUI();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetCurrentLesson() {
      if (!confirm(`Bạn có muốn làm lại từ đầu Bài ${currentLesson} không?`)) return;

      const total = currentLesson === 1 ? 20 : 33;
      stats[currentLesson] = { done: 0, correct: 0, wrong: 0, total: total, answeredItems: {} };
      const lessonData = currentLesson === 1 ? dataLesson1 : dataLesson2;

      renderQuiz(lessonData, `list-lesson-${currentLesson}`, currentLesson);
      updateStatsUI();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    updateStatsUI();
  </script>
</body>
