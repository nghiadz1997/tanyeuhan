      }
    ];

    const container = document.getElementById("questions-list");
    const countDisplay = document.getElementById("answered-count");

    // Render 30 câu hỏi
    quizData.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = "question-card";
      card.id = `card-${item.id}`;

      let optionsHtml = "";
      for (const [key, value] of Object.entries(item.options)) {
        optionsHtml += `
          <input type="radio" id="q${item.id}_${key}" name="question_${item.id}" value="${key}" onchange="updateProgress()">
          <label class="option-label" for="q${item.id}_${key}">
            <span class="option-key">${key}.</span>
            <span>${value}</span>
          </label>
        `;
      }

      card.innerHTML = `
        <div class="question-title">
          <span class="question-index">Câu ${index + 1}:</span> ${item.question}
        </div>
        <div class="options-grid">
          ${optionsHtml}
        </div>
        <div class="explanation" id="explain-${item.id}"></div>
      `;
      container.appendChild(card);
    });

    function updateProgress() {
      const checkedAnswers = document.querySelectorAll('input[type="radio"]:checked').length;
      countDisplay.textContent = checkedAnswers;
    }

    function submitQuiz() {
      let score = 0;
      let unanswered = 0;

      quizData.forEach((q) => {
        const selected = document.querySelector(`input[name="question_${q.id}"]:checked`);
        const card = document.getElementById(`card-${q.id}`);
        const explainBox = document.getElementById(`explain-${q.id}`);

        explainBox.style.display = "block";

        if (!selected) {
          unanswered++;
          card.classList.add("is-wrong");
          explainBox.style.background = "#fff1f2";
          explainBox.style.color = "#991b1b";
          explainBox.innerHTML = `<strong>Chưa chọn đáp án!</strong> Đáp án đúng là: <strong>${q.correct}</strong>. <em>(${q.explain})</em>`;
        } else if (selected.value === q.correct) {
          score++;
          card.classList.add("is-correct");
          explainBox.style.background = "#ecfdf5";
          explainBox.style.color = "#065f46";
          explainBox.innerHTML = `<strong>Chính xác!</strong> ${q.explain}`;
        } else {
          card.classList.add("is-wrong");
          explainBox.style.background = "#fff1f2";
          explainBox.style.color = "#991b1b";
          explainBox.innerHTML = `<strong>Sai rồi!</strong> Bạn chọn <strong>${selected.value}</strong>. Đáp án đúng là: <strong>${q.correct}</strong>. <em>(${q.explain})</em>`;
        }
      });

      const finalMark = ((score / quizData.length) * 10).toFixed(1);
      const scoreDisplay = document.getElementById("score-display");
      scoreDisplay.innerHTML = `Kết quả: <strong>${score}/${quizData.length}</strong> (${finalMark} điểm)`;

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.textContent = "Làm lại";
      submitBtn.setAttribute("onclick", "window.location.reload()");

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
