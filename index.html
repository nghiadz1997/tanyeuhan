<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn Tập Trắc Nghiệm Lịch Sử 10</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --correct: #10b981;
      --wrong: #ef4444;
      --correct-bg: #ecfdf5;
      --wrong-bg: #fef2f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px 120px 16px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
      text-align: center;
      border: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 800;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Tab navigation */
    .tabs-container {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      border: 2px solid var(--border);
      background: var(--card-bg);
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .tab-btn.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary);
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.1);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Question cards */
    .question-card {
      background: var(--card-bg);
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .question-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #0f172a;
    }

    .question-index {
      color: var(--primary);
      margin-right: 6px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      user-select: none;
      background: #fff;
    }

    .option-label:hover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option-key {
      font-weight: 700;
      color: var(--primary);
      min-width: 24px;
    }

    input[type="radio"] {
      display: none;
    }

    input[type="radio"]:checked + .option-label {
      border-color: var(--primary);
      background-color: #dbeafe;
      font-weight: 600;
      color: #1e40af;
    }

    .explanation {
      display: none;
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.92rem;
    }

    .is-correct {
      border-color: var(--correct) !important;
      background-color: var(--correct-bg);
    }

    .is-wrong {
      border-color: var(--wrong) !important;
      background-color: var(--wrong-bg);
    }

    /* Sticky Footer */
    .footer-actions {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 860px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .submit-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .score-box {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
    }
  </style>
</head>

    let currentLesson = 1;
    const answeredMap = { 1: 0, 2: 0 };

    // Khởi tạo Render câu hỏi cho cả 2 bài
    function renderQuestions(list, containerId, lessonNum) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      list.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "question-card";
        card.id = `card-l${lessonNum}-${item.id}`;

        let optionsHtml = "";
        for (const [key, value] of Object.entries(item.options)) {
          optionsHtml += `
            <input type="radio" id="l${lessonNum}_q${item.id}_${key}" name="l${lessonNum}_q_${item.id}" value="${key}" onchange="updateProgress(${lessonNum})">
            <label class="option-label" for="l${lessonNum}_q${item.id}_${key}">
              <span class="option-key">${key}.</span>
              <span>${value}</span>
            </label>
          `;
        }

        card.innerHTML = `
          <div class="question-title">
            <span class="question-index">Câu ${index + 1}:</span> ${item.question}
          </div>
          <div class="options-grid">
            ${optionsHtml}
          </div>
          <div class="explanation" id="explain-l${lessonNum}-${item.id}"></div>
        `;
        container.appendChild(card);
      });
    }

    renderQuestions(dataLesson1, "list-lesson-1", 1);
    renderQuestions(dataLesson2, "list-lesson-2", 2);

    // Chuyển đổi tab giữa Bài 1 và Bài 2
    function switchLesson(lessonNum) {
      currentLesson = lessonNum;
      
      document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx + 1 === lessonNum);
      });

      document.getElementById("lesson-1").classList.toggle("active", lessonNum === 1);
      document.getElementById("lesson-2").classList.toggle("active", lessonNum === 2);

      updateProgress(lessonNum);

      // Reset text nút nộp nếu bài đó chưa submit
      const submitBtn = document.getElementById("submit-btn");
      submitBtn.textContent = "Nộp Bài";
      submitBtn.setAttribute("onclick", "submitCurrentQuiz()");

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Cập nhật số câu đã làm
    function updateProgress(lessonNum) {
      const checkedAnswers = document.querySelectorAll(`input[name^="l${lessonNum}_q_"]:checked`).length;
      answeredMap[lessonNum] = checkedAnswers;
      if (currentLesson === lessonNum) {
        document.getElementById("score-display").innerHTML = `Đã làm: <span id="answered-count">${checkedAnswers}</span>/30`;
      }
    }

    // Chấm điểm bài kiểm tra hiện tại
    function submitCurrentQuiz() {
      const lessonData = currentLesson === 1 ? dataLesson1 : dataLesson2;
      let score = 0;
      let unanswered = 0;

      lessonData.forEach((q) => {
        const selected = document.querySelector(`input[name="l${currentLesson}_q_${q.id}"]:checked`);
        const card = document.getElementById(`card-l${currentLesson}-${q.id}`);
        const explainBox = document.getElementById(`explain-l${currentLesson}-${q.id}`);

        explainBox.style.display = "block";

        if (!selected) {
          unanswered++;
          card.classList.add("is-wrong");
          card.classList.remove("is-correct");
          explainBox.style.background = "#fff1f2";
          explainBox.style.color = "#991b1b";
          explainBox.innerHTML = `<strong>Chưa chọn đáp án!</strong> Đáp án đúng là: <strong>${q.correct}</strong>. <em>(${q.explain})</em>`;
        } else if (selected.value === q.correct) {
          score++;
          card.classList.add("is-correct");
          card.classList.remove("is-wrong");
          explainBox.style.background = "#ecfdf5";
          explainBox.style.color = "#065f46";
          explainBox.innerHTML = `<strong>Chính xác!</strong> ${q.explain}`;
        } else {
          card.classList.add("is-wrong");
          card.classList.remove("is-correct");
          explainBox.style.background = "#fff1f2";
          explainBox.style.color = "#991b1b";
          explainBox.innerHTML = `<strong>Sai rồi!</strong> Bạn chọn <strong>${selected.value}</strong>. Đáp án đúng là: <strong>${q.correct}</strong>. <em>(${q.explain})</em>`;
        }
      });

      const finalMark = ((score / lessonData.length) * 10).toFixed(1);
      const scoreDisplay = document.getElementById("score-display");
      scoreDisplay.innerHTML = `Bài ${currentLesson}: <strong>${score}/${lessonData.length}</strong> (${finalMark} điểm)`;

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.textContent = `Làm lại Bài ${currentLesson}`;
      submitBtn.setAttribute("onclick", `resetLesson(${currentLesson})`);

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Làm lại bài
    function resetLesson(lessonNum) {
      const inputs = document.querySelectorAll(`input[name^="l${lessonNum}_q_"]`);
      inputs.forEach(input => input.checked = false);

      const cards = document.querySelectorAll(`[id^="card-l${lessonNum}-"]`);
      cards.forEach(card => {
        card.classList.remove("is-correct", "is-wrong");
      });

      const explains = document.querySelectorAll(`[id^="explain-l${lessonNum}-"]`);
      explains.forEach(exp => {
        exp.style.display = "none";
        exp.innerHTML = "";
      });

      updateProgress(lessonNum);

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.textContent = "Nộp Bài";
      submitBtn.setAttribute("onclick", "submitCurrentQuiz()");

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
